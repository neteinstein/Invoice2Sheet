name: Deploy web to Cloudflare Pages

# Every push to main builds the Kotlin/Wasm site and publishes it to Cloudflare Pages, which serves
# invoice2sheet.pedrovicente.pt. See README.md → Web deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Fail fast, before spending CI time, if the Cloudflare credentials aren't set up (README.md).
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]} (see README.md → Web deployment)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # v6 defaults to a proprietary caching service; keep the open-source GitHub Actions cache.
          cache-provider: basic

      - name: Build wasmJs web distribution
        # The OAuth client ID isn't a secret (it ships in the page), so it lives in a repository
        # variable. Without it, users have to paste their own client ID in the app.
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID isn't set, so the site has no built-in Google sign-in. Visitors can still paste their own OAuth client ID on the Connect Google screen."
          fi
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy composeApp/build/dist/wasmJs/productionExecutable --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'invoice2sheet' }} --branch=main --commit-hash=${{ github.sha }}
